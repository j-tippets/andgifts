{% extends "base.html" %}
{% block title %}Add team member — Ag{% endblock %}
{% block content %}
<h1 style="margin-bottom:24px;">Add a team member</h1>

<form method="post" id="team-new-agent-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <fieldset>
    <legend>Details</legend>
    <div class="field-row">
      <div class="field"><label>First name</label><input type="text" name="first_name"></div>
      <div class="field"><label>Last name</label><input type="text" name="last_name"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Email</label><input type="email" name="email" required></div>
      <div class="field">
        <label>Role</label>
        <select name="role">
          <option value="agent">Team Member</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>How should they get access?</legend>
    <div class="access-method">
      <div class="access-option">
        <input type="radio" name="method" value="invite" id="method-invite" checked>
        <label for="method-invite" style="flex:1;">
          <div class="option-title">Email invite</div>
          <div class="subdued">They'll set their own password.</div>
        </label>
      </div>
      <div class="access-option">
        <input type="radio" name="method" value="direct" id="method-direct">
        <div style="flex:1;">
          <label for="method-direct">
            <div class="option-title">Set a password directly</div>
            <div class="subdued">You set a temporary password now.</div>
          </label>
          <div class="field" id="temp-password-field" style="margin-top:12px; display:none;">
            <label for="temp_password">Temporary password</label>
            <input type="text" id="temp_password" name="temp_password" placeholder="Leave blank to auto-generate">
          </div>
        </div>
      </div>
    </div>
  </fieldset>

  <script>
    (function () {
      var inviteRadio = document.getElementById('method-invite');
      var directRadio = document.getElementById('method-direct');
      var passwordField = document.getElementById('temp-password-field');
      var passwordInput = document.getElementById('temp_password');

      function sync() {
        passwordField.style.display = directRadio.checked ? '' : 'none';
      }

      inviteRadio.addEventListener('change', sync);
      directRadio.addEventListener('change', sync);
      passwordInput.addEventListener('focus', function () {
        directRadio.checked = true;
        sync();
      });

      sync();
    })();
  </script>

  <button type="submit" class="btn btn-primary">Add team member</button>
  <a href="{{ url_for('team.list_members') }}" class="btn btn-ghost">Cancel</a>
</form>
{% endblock %}
