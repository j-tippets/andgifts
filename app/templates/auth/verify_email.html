{% extends "base.html" %}
{% block title %}Email verified — &amp;Gifts{% endblock %}
{% block auth_content %}
<div style="max-width:380px; margin:80px auto; padding:32px; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; text-align:center;">
  <div class="eyebrow" style="text-align:center; margin-bottom:12px;">
    <img src="https://andgiftscdn.nyc3.cdn.digitaloceanspaces.com/ag_logo_badge.svg" alt="&amp;Gifts" height="100">
  </div>
  <h1 style="margin-bottom:12px;">Nice, you're verified!</h1>
  <p style="color:var(--evergreen-light); margin-bottom:24px;">Your email is confirmed. Click below to jump into your account.</p>
  <form method="POST">
    <button class="btn btn-primary" type="submit" style="width:100%;">Start using &amp;Gifts</button>
  </form>
</div>
{% endblock %}
