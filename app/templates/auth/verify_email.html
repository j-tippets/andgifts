{% extends "base.html" %}
{% block title %}Confirm your email — &amp;Gifts{% endblock %}
{% block auth_content %}
<div style="max-width:380px; margin:80px auto; padding:32px; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; text-align:center;">
  <div class="eyebrow" style="text-align:center; margin-bottom:12px;">
    <img src="https://andgiftscdn.nyc3.cdn.digitaloceanspaces.com/ag_logo_badge.svg" alt="&amp;Gifts" height="100">
  </div>
  <h1 style="margin-bottom:12px;">Confirm your email</h1>
  <p style="color:var(--evergreen-light); margin-bottom:24px;">Click below to activate your account and sign in.</p>
  <form method="POST">
    <button class="btn btn-primary" type="submit" style="width:100%;">Confirm my email</button>
  </form>
</div>
{% endblock %}
