{% extends "base.html" %}
{% block title %}Invite your team — Ag{% endblock %}
{% block auth_content %}
<div style="max-width:460px; margin:60px auto; padding:32px; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;">
  <div class="eyebrow" style="text-align:center; margin-bottom:12px;">
    <img src="https://andgiftscdn.nyc3.cdn.digitaloceanspaces.com/ag_logo_badge.svg" alt="&amp;Gifts" height="100">
  </div>
  {% set step = 4 %}
  {% include "onboarding/_step_dots.html" %}
  <h1 style="margin-bottom:8px;">Add your team</h1>
  <p class="subdued" style="margin-bottom:20px;">Add up to {{ max_invites }} teammates.</p>

  <form method="POST">
    <div id="inviteRows">
      <div class="field invite-row">
        <label>Teammate email</label>
        <input type="email" name="invite_email">
      </div>
    </div>
    <button type="button" id="addInviteRow" class="btn btn-ghost" style="width:100%; margin-bottom:16px;">+ Add another</button>

    <p id="inviteCalc" class="subdued" style="text-align:center; margin:0 0 16px;">1 seat &times; ${{ team_price }}/mo = <strong>${{ team_price }}/mo</strong></p>

    <button class="btn btn-primary" type="submit" style="width:100%; margin-bottom:12px;">Continue to billing</button>
  </form>
  <form method="POST" action="{{ url_for('onboarding.invites_skip') }}" style="text-align:center;">
    <button class="link-button" type="submit">Skip for now</button>
  </form>
</div>

<script>
(function () {
  var maxInvites = {{ max_invites }};
  var teamPrice = {{ team_price }};
  var rows = document.getElementById('inviteRows');
  var addBtn = document.getElementById('addInviteRow');
  var calc = document.getElementById('inviteCalc');

  function updateAddButton() {
    var count = rows.querySelectorAll('.invite-row').length;
    addBtn.style.display = count >= maxInvites ? 'none' : '';
  }

  function updateCalc() {
    var filled = 0;
    rows.querySelectorAll('.invite-row input').forEach(function (input) {
      if (input.value.trim()) filled += 1;
    });
    var seats = filled + 1;
    var total = seats * teamPrice;
    calc.innerHTML = seats + ' seat' + (seats === 1 ? '' : 's') + ' &times; $' + teamPrice + '/mo = <strong>$' + total + '/mo</strong>';
  }

  addBtn.addEventListener('click', function () {
    if (rows.querySelectorAll('.invite-row').length >= maxInvites) return;
    var row = document.createElement('div');
    row.className = 'field invite-row';
    row.innerHTML = '<label>Teammate email</label><input type="email" name="invite_email">';
    rows.appendChild(row);
    row.querySelector('input').addEventListener('input', updateCalc);
    updateAddButton();
  });

  rows.querySelectorAll('.invite-row input').forEach(function (input) {
    input.addEventListener('input', updateCalc);
  });

  updateAddButton();
  updateCalc();
})();
</script>
{% endblock %}
