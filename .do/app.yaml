name: andgifts
region: nyc1

databases:
  - name: andgifts-db
    engine: MYSQL
    version: "8"
    production: false   # flip to true when you're ready to pay for the HA tier

services:
  - name: web
    github:
      repo: j-tippets/andgifts
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: pip install -r requirements.txt
    run_command: gunicorn --worker-tmp-dir /dev/shm --workers 2 --bind 0.0.0.0:8080 wsgi:app
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        type: SECRET
      - key: DB_USER
        value: ${andgifts-db.USERNAME}
      - key: DB_PASSWORD
        type: SECRET
        value: ${andgifts-db.PASSWORD}
      - key: DB_HOST
        value: ${andgifts-db.HOSTNAME}
      - key: DB_PORT
        value: ${andgifts-db.PORT}
      - key: DB_NAME
        value: ${andgifts-db.DATABASE}
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: SENDGRID_API_KEY
        type: SECRET
      - key: TWILIO_ACCOUNT_SID
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        type: SECRET
      - key: ANTHROPIC_API_KEY
        type: SECRET
      - key: GIT_COMMIT_HASH
        value: ${_self.COMMIT_HASH}

# Nightly job that generates dashboard suggestions for every org.
# This is what makes the daily dashboard feel "waiting for you" each
# morning instead of computing on-demand every page load.
# DO App Platform scheduled (cron) jobs are GA as of late 2025 -- min
# interval is every 15 min. This runs once a day at 5am UTC (~11pm MT).
jobs:
  - name: nightly-suggestions
    github:
      repo: YOUR_GITHUB_USERNAME/andgifts
      branch: main
    source_dir: /
    build_command: pip install -r requirements.txt
    run_command: python jobs/generate_daily_suggestions.py
    kind: SCHEDULED
    schedule:
      cron: "0 5 * * *"
    instance_size_slug: basic-xxs
    envs:
      - key: FLASK_ENV
        value: production
      - key: DB_USER
        value: ${andgifts-db.USERNAME}
      - key: DB_PASSWORD
        type: SECRET
        value: ${andgifts-db.PASSWORD}
      - key: DB_HOST
        value: ${andgifts-db.HOSTNAME}
      - key: DB_PORT
        value: ${andgifts-db.PORT}
      - key: DB_NAME
        value: ${andgifts-db.DATABASE}

  # Enforces the hard cutoff on Solo's free trial (config.TRIAL_DAYS) --
  # see jobs/downgrade_expired_trials.py's docstring for why this is
  # safe to run daily with no extra guardrails (idempotent, only ever
  # touches org.tier, never deletes/hides data). Runs an hour after
  # nightly-suggestions purely to keep the two jobs' logs easy to tell
  # apart in the DO dashboard -- no actual ordering dependency between
  # them.
  - name: downgrade-expired-trials
    github:
      repo: YOUR_GITHUB_USERNAME/andgifts
      branch: main
    source_dir: /
    build_command: pip install -r requirements.txt
    run_command: python jobs/downgrade_expired_trials.py
    kind: SCHEDULED
    schedule:
      cron: "0 6 * * *"
    instance_size_slug: basic-xxs
    envs:
      - key: FLASK_ENV
        value: production
      - key: DB_USER
        value: ${andgifts-db.USERNAME}
      - key: DB_PASSWORD
        type: SECRET
        value: ${andgifts-db.PASSWORD}
      - key: DB_HOST
        value: ${andgifts-db.HOSTNAME}
      - key: DB_PORT
        value: ${andgifts-db.PORT}
      - key: DB_NAME
        value: ${andgifts-db.DATABASE}

  # Backstop for the rare process-crash-mid-charge gap in
  # dashboard.approve_action -- see reconcile_stuck_processing_actions's
  # docstring in app/services/suggestion_engine.py for why a plain
  # revert-to-pending is safe here (Stripe idempotency keys, not a
  # separate Stripe lookup, are what actually prevent a double charge
  # on the next retry). Runs every 15 minutes -- DO App Platform's
  # minimum cron interval -- since a suggestion stuck at "processing"
  # is invisible on the agent's dashboard the whole time it's stuck,
  # unlike the once-daily jobs above where a day's delay is fine.
  - name: reconcile-stuck-actions
    github:
      repo: YOUR_GITHUB_USERNAME/andgifts
      branch: main
    source_dir: /
    build_command: pip install -r requirements.txt
    run_command: python jobs/reconcile_stuck_actions.py
    kind: SCHEDULED
    schedule:
      cron: "*/15 * * * *"
    instance_size_slug: basic-xxs
    envs:
      - key: FLASK_ENV
        value: production
      - key: DB_USER
        value: ${andgifts-db.USERNAME}
      - key: DB_PASSWORD
        type: SECRET
        value: ${andgifts-db.PASSWORD}
      - key: DB_HOST
        value: ${andgifts-db.HOSTNAME}
      - key: DB_PORT
        value: ${andgifts-db.PORT}
      - key: DB_NAME
        value: ${andgifts-db.DATABASE}
